name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, build and browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run module tests
        run: npm test

      - name: Build standalone HTML
        run: npm run build

      - name: Install matching Chromium and system dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Run browser regression
        run: npm run test:browser

      - name: Run floating panel regression
        run: npm run test:floating

      - name: Run grab timeline regression
        run: npm run test:grab-timeline

      - name: Run grab usability regression
        run: npm run test:grab-usability

      - name: Run mobile layout regression
        run: npm run test:mobile

      - name: Run FingerTut regression
        run: npm run test:fingertut

      - name: Run language switching regression
        run: npm run test:language

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
